name: Snapshot GEX (opciones SPY/QQQ)

# La captura solo vale entre 16:30 y 19:30 de Nueva York (20:30-23:30 UTC en verano,
# 21:30-00:30 UTC en invierno). GitHub retrasa los cron entre 30 y 90 minutos (el 14-oct los de
# las 20:45/21:45 UTC arrancaron a las 23:37 y a las 00:13, ya fuera de ventana: el trabajo
# acababa en verde sin capturar nada). Por eso se programan varios disparos escalonados: los que
# caen fuera de ventana o con el snapshot ya hecho salen sin tocar nada (actualiza_gex.py).
on:
  schedule:
    - cron: "35 20 * * 1-5"
    - cron: "5 21 * * 1-5"
    - cron: "35 21 * * 1-5"
    - cron: "5 22 * * 1-5"
    - cron: "35 22 * * 1-5"
    - cron: "5 23 * * 1-5"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba de entorno (no toca el histórico)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: gex
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas numpy pyarrow
      - name: Captura
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prueba }}" = "true" ]; then
            python actualiza_gex.py --prueba
          else
            python actualiza_gex.py
          fi
      - name: Commit y push si hay cambios
        run: |
          git config user.name "vxn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gex/snapshots gex/gex_history.csv gex/gamma_levels.csv
          git diff --cached --quiet && echo "sin cambios" || (git commit -m "GEX $(TZ=America/New_York date +%F)" && git pull --rebase && git push)
