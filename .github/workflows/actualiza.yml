name: Actualiza feeds de volatilidad

on:
  schedule:
    # Los cron de GitHub en punto o en y media se retrasan o se pierden con carga alta (el de
    # "30 21" no llegó a ejecutarse varios días de octubre de 2026): minutos "raros".
    - cron: "17 21 * * 1-5"   # 21:17 UTC, L-V (VXN, VIX y GVZ cierran 20:15 UTC en verano)
    - cron: "47 23 * * 1-5"   # 23:47 UTC, repaso: en invierno cierran 21:15 UTC y Yahoo aún puede dar un
                              # cierre provisional. Sólo hace commit si el dato cambió.
    - cron: "23 5 * * 2-6"    # 05:23 UTC (07:23 en España), de martes a sábado: Yahoo publica tarde el
                              # cierre del VXN y del GVZ (y a veces del VIX), a veces ya de madrugada
                              # (pasó el 16 y el 19-oct-2026). Corrige el feed antes del informe de
                              # las 8:00. Reescribe el histórico completo; sólo hace commit si cambió algo.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas
      - run: python actualiza_vxn.py
      - run: python actualiza_vix.py
      - run: python actualiza_gvz.py
      - name: Commit y push si hay cambios
        run: |
          git config user.name "vxn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add VXN_regimen.csv VIX_regimen.csv GVZ_regimen.csv
          git diff --cached --quiet && echo "sin cambios" || (git commit -m "Feeds $(date -u +%F)" && git push)
